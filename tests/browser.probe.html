<!DOCTYPE html>
<!--
  Browser smoke probe. Copied into the site root by tests/browser.test.js and
  removed afterwards, because it must run same-origin with the real scripts.

  Drives the whole admin-content flow in a real browser: login, load, render,
  edit a project and a fact, then save. The result is written into #out as
  RESULT::key=value ;; key=value so the runner can read it from --dump-dom.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<title>probe</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/i18n.de.js"></script>
<script src="js/i18n.js"></script>
<style>.admin-hidden{display:none;}</style>
</head>
<body>
<div id="out">RUNNING</div>
<div id="acBuild" class="ac-build">loading</div>
<div id="acLogin" class="admin-login">
	<input type="password" id="acPw">
	<button type="button" id="acLoginBtn">login</button>
	<div id="acLoginMsg" class="ac-msg"></div>
</div>
<div id="acApp" class="admin-hidden">
	<p id="acHint"></p>
	<div class="ac-tabs">
		<button type="button" class="ac-tab on" data-panel="projects"></button>
		<button type="button" class="ac-tab" data-panel="jobs"></button>
		<button type="button" class="ac-tab" data-panel="facts"></button>
	</div>
	<div id="acPanelProjects"></div>
	<div id="acPanelJobs" class="admin-hidden"></div>
	<div id="acPanelFacts" class="admin-hidden"></div>
	<button type="button" id="acSave">save</button>
	<button type="button" id="acDownload">download</button>
	<select id="acTarget"><option value="source">source</option><option value="en">en</option></select>
	<div class="ac-msg" id="acMsg"></div>
</div>
<script>
window.__errors = [];
window.addEventListener('error', function (e) {
	window.__errors.push('ERR ' + e.message + ' @' + (e.filename || '') + ':' + e.lineno);
});
window.addEventListener('unhandledrejection', function (e) {
	window.__errors.push('REJ ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});
</script>
<script src="js/amcf-content.js"></script>
<script src="js/admin-content.js"></script>
<script>
(function () {
	var log = [];
	function say(k, v) { log.push(k + '=' + v); }
	say('AMCFContent', typeof window.AMCFContent);

	function start() {
		setTimeout(function () {
			try {
				document.getElementById('acPw').value = 'AMCF2026';
				document.getElementById('acLoginBtn').click();
				say('loginClicked', true);
			} catch (e) { say('LOGIN_THREW', e && e.message); }

			setTimeout(function () {
				try {
					say('buildStamp', document.getElementById('acBuild').textContent);
					say('appVisible', !document.getElementById('acApp').classList.contains('admin-hidden'));
					say('projectsHtml', document.getElementById('acPanelProjects').innerHTML.length);
					say('jobsHtml', document.getElementById('acPanelJobs').innerHTML.length);
					say('factsHtml', document.getElementById('acPanelFacts').innerHTML.length);
					say('loadMsg', document.getElementById('acMsg').textContent);

					var n = document.getElementById('p0_name');
					say('p0_nameFound', !!n);
					if (n) { n.value = 'PROBE NAME'; }
					var f = document.getElementById('f_name');
					say('f_nameFound', !!f);
					if (f) { f.value = 'PROBE FACT'; }
					document.getElementById('acSave').click();
					say('saveClicked', true);
				} catch (e) { say('EDIT_THREW', e && e.message); }

				setTimeout(function () {
					say('saveMsg', document.getElementById('acMsg').textContent);
					say('saveMsgClass', document.getElementById('acMsg').className);
					say('errors', window.__errors.join(' | ') || 'none');
					document.getElementById('out').textContent = 'RESULT::' + log.join(' ;; ');
				}, 2500);
			}, 2500);
		}, 300);
	}

	// the admin attaches its listeners on DOMContentLoaded, so wait for it
	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', start);
	} else {
		start();
	}
})();
</script>
</body>
</html>
