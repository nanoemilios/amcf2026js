<!-- admin-no-php.html -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>AMCF Admin (No PHP)</title>
<style>
  body{font-family:sans-serif;padding:20px;max-width:900px;margin:0 auto}
  .btn{padding:8px 16px;margin:4px;cursor:pointer}
  .section{margin:20px 0;padding:15px;border:1px solid #ddd;border-radius:4px}
  textarea{width:100%;height:300px;font-family:monospace;font-size:13px}
  label{display:block;margin:8px 0 4px;font-weight:bold}
  input[type=file]{margin:8px 0}
  .status{padding:8px;margin:8px 0;border-radius:4px}
  .success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
  .error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
  .info{background:#d1ecf1;color:#0c5460;border:1px solid #bee5eb}
</style>
</head>
<body>
<h1>AMCF Admin (No PHP)</h1>

<div class="status info">
  <strong>How it works:</strong> Uses File System Access API (Chrome/Edge/Opera). 
  Fallback: Download/Upload JSON. 
  <br>Click "Load File" → grant permission → edit → "Save File".
</div>

<div class="section">
  <button class="btn" onclick="loadFile()">📂 Load File (Grant Permission)</button>
  <button class="btn" onclick="downloadJSON()">⬇ Download JSON</button>
  <label>Or upload:</label>
  <input type="file" id="fileInput" accept=".js,.json" onchange="handleUpload(event)">
</div>

<div class="section">
  <label>Data (data/projects.js content):</label>
  <textarea id="jsonEditor" spellcheck="false" placeholder="Load or paste JSON here..."></textarea>
</div>

<div class="section">
  <button class="btn" onclick="saveFile()">💾 Save File (File System API)</button>
  <button class="btn" onclick="validateJSON()">✓ Validate JSON</button>
  <div id="status"></div>
</div>

<script>
// File System Access API handle
let fileHandle = null;

async function loadFile() {
  try {
    if (!('showOpenFilePicker' in window)) {
      showStatus('File System API not supported. Use Download/Upload.', 'error');
      return;
    }
    [fileHandle] = await window.showOpenFilePicker({
      types: [{ description: 'JS/JSON files', accept: { 'application/javascript': ['.js'], 'application/json': ['.json'] } }]
    });
    const file = await fileHandle.getFile();
    const text = await file.text();
    document.getElementById('jsonEditor').value = text;
    showStatus('File loaded. Edit and click "Save File".', 'success');
  } catch (e) {
    if (e.name !== 'AbortError') showStatus('Error: ' + e.message, 'error');
  }
}

function downloadJSON() {
  const text = document.getElementById('jsonEditor').value;
  if (!text.trim()) return showStatus('Nothing to download.', 'error');
  try { JSON.parse(text); } catch (e) { return showStatus('Invalid JSON: ' + e.message, 'error'); }
  const blob = new Blob([text], { type: 'application/javascript' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'projects.js';
  a.click(); URL.revokeObjectURL(url);
  showStatus('Downloaded projects.js', 'success');
}

function handleUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('jsonEditor').value = e.target.result;
    showStatus('File uploaded. Edit and save.', 'success');
  };
  reader.readAsText(file);
}

async function saveFile() {
  const text = document.getElementById('jsonEditor').value;
  if (!text.trim()) return showStatus('Nothing to save.', 'error');
  try { JSON.parse(text); } catch (e) { return showStatus('Invalid JSON: ' + e.message, 'error'); }
  
  if (fileHandle) {
    try {
      const writable = await fileHandle.createWritable();
      await writable.write(text);
      await writable.close();
      showStatus('File saved via File System API!', 'success');
      return;
    } catch (e) {
      showStatus('File System API save failed: ' + e.message + '. Falling back to download.', 'error');
    }
  }
  // Fallback
  downloadJSON();
}

function validateJSON() {
  const text = document.getElementById('jsonEditor').value;
  try { JSON.parse(text); showStatus('Valid JSON', 'success'); }
  catch (e) { showStatus('Invalid JSON: ' + e.message, 'error'); }
}

function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}
</script>
</body>
</html>
